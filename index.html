<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Playlist Length Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 0;
            background: #f5f5f5;
            color: #333;
        }
        h1 {
            text-align: center;
        }
        form {
            text-align: center;
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 300px;
            padding: 10px;
            margin: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            padding: 10px 15px;
            border: none;
            background-color: #007bff;
            color: #fff;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #results {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>YouTube Playlist Length Calculator</h1>
    <form id="playlistForm">
        <input type="text" id="playlistId" placeholder="Enter YouTube Playlist ID" required>
        <button type="submit">Calculate</button>
    </form>
    <div id="results"></div>

    <script>
        const API_KEY = 'AIzaSyASUbJEh1D8mNouHF4evVr-UhTGtFdtTA4'; // Replace with your YouTube API key

        document.getElementById('playlistForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const playlistId = document.getElementById('playlistId').value;
            document.getElementById('results').innerText = 'Calculating...';

            try {
                let totalDuration = 0;
                let nextPageToken = '';
                do {
                    const response = await fetch(`https://www.googleapis.com/youtube/v3/playlistItems?part=contentDetails&maxResults=50&playlistId=${playlistId}&pageToken=${nextPageToken}&key=${API_KEY}`);
                    const data = await response.json();

                    for (const item of data.items) {
                        const videoId = item.contentDetails.videoId;
                        const videoResponse = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=contentDetails&id=${videoId}&key=${API_KEY}`);
                        const videoData = await videoResponse.json();
                        const duration = videoData.items[0].contentDetails.duration;
                        totalDuration += parseISO8601Duration(duration);
                    }

                    nextPageToken = data.nextPageToken;
                } while (nextPageToken);

                const formattedDuration = formatDuration(totalDuration);
                document.getElementById('results').innerText = `Total Playlist Duration: ${formattedDuration}`;
            } catch (error) {
                console.error(error);
                document.getElementById('results').innerText = 'Error calculating playlist duration.';
            }
        });

        function parseISO8601Duration(duration) {
            const match = duration.match(/PT(\d+H)?(\d+M)?(\d+S)?/);
            const hours = parseInt(match[1] || 0) || 0;
            const minutes = parseInt(match[2] || 0) || 0;
            const seconds = parseInt(match[3] || 0) || 0;
            return hours * 3600 + minutes * 60 + seconds;
        }

        function formatDuration(totalSeconds) {
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            return `${hours}h ${minutes}m ${seconds}s`;
        }
    </script>
</body>
</html>
